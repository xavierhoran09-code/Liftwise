function workout(){const D=S.draft,i=D.cur,ex=D.exs[i],c=cfg(ex.id),x=X[ex.id],r=rec(ex.id,c),pv=sessionsOf(ex.id).filter(s=>s.sets.length).pop(),inc=x[6]||1;
 if(!V.in||V.in.i!=i)V.in={i,w:r.w!=null?dw(r.w):(pv?dw(Math.max(...pv.sets.map(s=>s.w))):''),r:r.r||c.lo,rir:null};const I=V.in,st=U()=='lb'?5:inc;
 const stp=(f,d,l)=>`<button class="btn" data-a="step" data-f="${f}" data-d="${d}">${l}</button>`;
 return`<div class="ov"><div><div class="row sp"><button class="btn sm" data-a="quit">Exit</button><span class="m">${esc(D.pn)} · ${mmss(Math.floor((Date.now()-D.start)/1000))}</span><button class="btn sm p" data-a="fin">Finish</button></div>
 <div id="mus" class="card" style="padding:8px 10px;margin:12px 0 0">${musHtml()}</div><div class="row sp" style="margin:16px 0 4px"><button class="btn sm" data-a="ex" data-d="-1">‹</button><span class="m">Exercise ${i+1} of ${D.exs.length}</span><button class="btn sm" data-a="ex" data-d="1">›</button></div>
 <h1 style="margin:0">${x[0]}</h1><div class="m">${x[2]} · ${c.sets} × ${c.lo}–${c.hi} · rest ${mmss(restFor(c))}</div>
 <div class="card" style="margin-top:12px"><div class="m">Previous${pv?' · '+fd(pv.t):''}</div>${pv?pv.sets.map((s,k)=>`<div>${fw(s.w)} × ${s.r}</div>`).join(''):'<div>No previous sets</div>'}</div>
 <div class="tip" data-a="why" style="cursor:pointer;padding:9px 12px"><div class="row sp"><b>${r.h}</b><span class="m">Next target ${V.why?'▲':'▼'}</span></div>${V.why?`${r.m}<div class="m" style="margin-top:8px">${r.why}</div>`:''}</div>
 ${ex.sets.map((s,k)=>`<div class="row sp card" style="padding:10px 14px;margin-bottom:6px"><span>Set ${k+1}: ${fw(s.w)} × ${s.r}${s.rir!=null?' · RIR '+s.rir:''}${s.st=='failed'?' · missed':''}${s.note?' · '+esc(s.note):''}</span><button class="btn sm" data-a="delset" data-k="${k}">✕</button></div>`).join('')}
 <h2>Set ${ex.sets.length+1}</h2><div class="in"><div><div class="m">Weight (${U()})</div><div class="row">${stp('w',-st,'−')}<input type="number" inputmode="decimal" data-f="w" value="${I.w}">${stp('w',st,'+')}</div></div><div><div class="m">Reps</div><div class="row">${stp('r',-1,'−')}<input type="number" inputmode="numeric" data-f="r" value="${I.r}">${stp('r',1,'+')}</div></div></div>
 <div class="row" style="margin:12px 0"><span class="m">RIR</span>${[0,1,2,3,4].map(n=>`<div class="chip ${I.rir===n?'on':''}" data-a="rir" data-v="${n}" style="padding:8px 14px">${n}</div>`).join('')}</div>
 <input type="text" data-f="note" placeholder="Note (optional)" value="${esc(I.note||'')}" style="margin-bottom:10px"><button class="btn p big" data-a="set">Complete set</button><button class="btn big sm" style="margin-top:8px" data-a="miss">Log as missed reps</button></div></div>`+(V.tm?`<div class="tb"><div class="row sp"><div><div class="m">Rest</div><div class="tm" id="tm">${mmss(V.tm.ps!=null?V.tm.ps:Math.max(0,Math.ceil((V.tm.end-Date.now())/1000)))}</div></div><div class="row wr"><button class="btn sm" data-a="tadd" data-d="-15">−15</button><button class="btn sm" data-a="tadd" data-d="15">+15</button><button class="btn sm" data-a="tadd" data-d="30">+30</button><button class="btn sm" data-a="tpause">${V.tm.ps!=null?'Resume':'Pause'}</button><button class="btn sm p" data-a="tskip">Skip</button></div></div></div>`:'')}
function sheet(){const s=V.sheet;if(!s)return'';let h='';
 if(s.t=='log'){const l=S.logs.find(l=>l.id==s.i);h=`<h3>${esc(l.pn)}</h3><div class="m" style="margin-bottom:10px">${fd(l.date)} · ${Math.round(l.dur/6e4)} min · ${fw(l.vol)} volume</div>`+l.exs.map(e=>`<div class="card"><b>${X[e.id][0]}</b>${e.sets.map((x,i)=>`<div>Set ${i+1}: ${fw(x.w)} × ${x.r}${x.rir!=null?' <span class="m">RIR '+x.rir+'</span>':''}${x.st=='failed'?' <span class="m">missed</span>':''}${x.note?' <span class="m">· '+esc(x.note)+'</span>':''}</div>`).join('')}</div>`).join('')+`<button class="btn rd" data-a="dellog" data-i="${l.id}">Delete workout</button>`}
 else if(s.t=='ux'){const f=s.f,o=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`).join('');h=`<h3>Your own exercise</h3><input data-ux="n" placeholder="Exercise name" value="${esc(f.n)}" style="margin:8px 0"><div class="row"><select data-ux="t">${o([['c','Compound'],['i','Isolation']],f.t)}</select><select data-ux="m">${o(MUS.map(m=>[m,m]),f.m)}</select><select data-ux="eq">${o([['b','Barbell'],['d','Dumbbell'],['m','Machine/cable'],['w','Bodyweight']],f.eq)}</select></div><button class="btn big" style="margin:10px 0" data-a="uxr">Research this exercise</button><p class="m">${esc(f.note||'Looks the exercise up online, then fills in muscles, type, rep range, rest and load step. You can edit everything.')}</p><div class="row">${[['lo','Min reps'],['hi','Max reps'],['rest','Rest s'],['inc','Jump kg']].map(a=>`<div class="g"><div class="m">${a[1]}</div><input type="number" data-ux="${a[0]}" value="${f[a[0]]}"></div>`).join('')}</div>${f.sec?`<p class="m">Also works: ${esc(f.sec)}</p>`:''}<button class="btn p big" style="margin-top:12px" data-a="uxs">Save and add</button>`}
 else if(s.t=='dv')h=`<h3>Play on</h3>${SP.dl?SP.dl.map(d=>`<div class="card" data-a="spdset" data-i="${d.id}" style="cursor:pointer">${esc(d.name)} <span class="m">${esc(d.type)}${d.is_active?' · active':''}</span></div>`).join('')||'<p class="m">No devices found. Open Spotify on your phone.</p>':'<p class="m">Loading…</p>'}<p class="m">If a speaker does not respond, pick your phone.</p>`;
 else if(s.t=='q')h=`<h3>Queue</h3><div class="row"><input id="qs" placeholder="Search a song to add"><button class="btn" data-a="spqs">Search</button></div>${SP.qr?'<h2>Results</h2>'+SP.qr.map(t=>`<div class="row sp"><span class="g">${trk(t)}</span><button class="btn sm" data-a="spadd" data-u="${t.uri}">Add</button></div>`).join(''):''}<h2>Up next</h2>${SP.q?SP.q.map(trk).join('')||'<p class="m">Queue is empty.</p>':'<p class="m">Loading…</p>'}<p class="m">Spotify lets apps view the queue and add songs. Removing or reordering must be done in the Spotify app.</p>`;
 else if(s.t=='pl')h=`<h3>Playlists</h3><p class="m">${SP.pl?(SP.ord?'Most recently played first.':'Reconnect Spotify in Profile to sort by recently played.'):''}</p>${SP.pl?SP.pl.map(p=>`<div class="card" data-a="spp" data-u="${p.uri}" style="cursor:pointer">${esc(p.name)}</div>`).join('')||'<p class="m">No playlists found.</p>':'<p class="m">Loading…</p>'}`;else h=`<h3>Workout saved</h3><div class="m" style="margin-bottom:10px">${s.dur} min · ${fw(s.vol)} · ${s.n} sets</div>${s.prs.length?`<div class="card" style="padding:10px 14px">${s.prs.map(p=>'▲ '+p).join('<br>')}</div>`:''}<h2>Next time</h2>${s.next.map(n=>`<div class="tip"><b>${n.x}: ${n.h}</b>${n.m}</div>`).join('')}`;
 return`<div class="sh" data-a="closeS"><div data-keep="1">${h}<button class="btn big" style="margin-top:12px" data-a="closeS">Close</button></div></div>`}
function render(){document.documentElement.dataset.theme=!S?'dark':S.set.theme=='system'?(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):S.set.theme;const a=$('#app');
 if(!S){a.innerHTML=onboard();return}
 a.innerHTML=(S.draft&&V.run?workout():({today,plans,progress,profile}[V.tab])()+nav());$('#sheet').innerHTML=sheet()}
// ---- actions ----
function startW(pid){const p=S.plans.find(p=>p.id==pid);if(!p||!p.exs.length)return toast('Add exercises first');S.draft={pid,pn:p.name,start:Date.now(),exs:p.exs.map(e=>({id:e.id,sets:[]})),cur:0};V.run=1;V.in=null;save();if(SP.tok())spPoll();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch{}render()}
function logSet(st){const D=S.draft,ex=D.exs[D.cur],c=cfg(ex.id),I=V.in;if(I.w===''||I.w==null||I.r===''||I.r==null)return toast('Enter weight and reps');
 ex.sets.push({w:kw(I.w),r:+I.r,rir:I.rir,st,t:Date.now(),rest:restFor(c),note:I.note||''});I.note='';save();if(S.set.auto)startT(restFor(c));render()}
function finish(){const D=S.draft,exs=D.exs.filter(e=>e.sets.length);if(!exs.length)return toast('Log at least one set');const prs=[];
 exs.forEach(e=>{const H=sessionsOf(e.id).flatMap(s=>s.sets),d=e.sets.filter(s=>s.st=='done');if(!H.length||!d.length)return;const pw=Math.max(...H.map(s=>s.w)),pe=Math.max(...H.map(s=>e1(s.w,s.r))),nw=Math.max(...d.map(s=>s.w)),ne=Math.max(...d.map(s=>e1(s.w,s.r)));
  if(nw>pw)prs.push(X[e.id][0]+': heaviest weight '+fw(nw));else if(ne>pe*1.01)prs.push(X[e.id][0]+': best estimated 1RM '+fw(ne))});
 const end=Date.now(),l={id:uid(),pn:D.pn,date:D.start,end,dur:end-D.start,vol:exs.reduce((a,e)=>a+vol(e.sets),0),exs};S.logs.push(l);S.draft=null;V.run=0;V.tm=null;save();
 V.sheet={t:'sum',dur:Math.round(l.dur/6e4),vol:l.vol,n:exs.reduce((a,e)=>a+e.sets.length,0),prs,next:exs.map(e=>({x:X[e.id][0],...rec(e.id,cfg2(D.pid,e.id))}))};render()}
function cfg2(pid,id){const p=S.plans.find(p=>p.id==pid),e=p&&p.exs.find(e=>e.id==id),x=X[id];return e||{id,sets:3,lo:x[3],hi:x[4],rest:x[5]}}
const P=id=>S.plans.find(p=>p.id==id);
const A={tab:(d)=>{V.tab=d.t;if(d.p)V.pe=d.p;V.sheet=null;render();scrollTo(0,0)},start:d=>startW(d.p),resume:()=>{V.run=1;render()},
 sub:d=>{V.sub=d.s;render()},log:d=>{V.sheet={t:'log',i:d.i};render()},closeS:(d,t,e)=>{if(e.target.closest('[data-keep]')&&!e.target.closest('button'))return;V.sheet=null;render()},
 dellog:d=>{if(confirm('Delete this workout permanently?')){S.logs=S.logs.filter(l=>l.id!=d.i);save();V.sheet=null;render()}},
 bell:async()=>{if(!window.Notification)return toast('Notifications are not supported here');const r=await Notification.requestPermission();S.set.notif=r=='granted';save();toast(r=='granted'?'Notifications on':'Notifications blocked in browser settings');render()},
 pe:d=>{V.pe=V.pe==d.p?null:d.p;render()},newp:()=>{const p={id:uid(),name:'New workout',days:[],exs:[]};S.plans.push(p);V.pe=p.id;save();render()},

 dup:d=>{const p=P(d.p);S.plans.push({...JSON.parse(JSON.stringify(p)),id:uid(),name:p.name+' copy',days:[]});save();render()},delp:d=>{if(confirm('Delete this workout plan?')){S.plans=S.plans.filter(p=>p.id!=d.p);save();render()}},
 step:d=>{const f=d.f;V.in[f]=Math.max(0,+((+V.in[f]||0)+ +d.d).toFixed(2));render()},rir:d=>{V.in.rir=V.in.rir===+d.v?null:+d.v;render()},why:()=>{V.why=!V.why;render()},
 set:()=>logSet('done'),miss:()=>logSet('failed'),delset:d=>{S.draft.exs[S.draft.cur].sets.splice(+d.k,1);save();render()},

 tpause:()=>{const t=V.tm;if(t.ps!=null){t.end=Date.now()+t.ps*1000;t.ps=null}else t.ps=Math.ceil((t.end-Date.now())/1000);render()},tskip:()=>{V.tm=null;render()},
 spc:spLogin,spd:()=>{localStorage.removeItem('lwsp');SP.cur=null;SP.err='';render()},spk:d=>{const k=d.k;if(k=='pp')spCmd('/me/player/'+(SP.cur&&SP.cur.p?'pause':'play'),'PUT');else spCmd('/me/player/'+k,'POST')},sppl:()=>{V.sheet={t:'pl'};SP.pl=null;render();spLoadPl()},

 spq:()=>{V.sheet={t:'q'};SP.q=null;SP.qr=null;render();spApi('/me/player/queue').then(j=>{SP.q=(j.queue||[]).slice(0,20);render()}).catch(e=>{V.sheet=null;SP.err=e.s==404?NODEV:spErr(e);render()})},

 exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='liftwise-'+dk(Date.now())+'.json';a.click()},
 wipe:()=>{if(confirm('Delete ALL workouts, plans and settings from this device?')&&confirm('This cannot be undone. Continue?')){localStorage.removeItem('lw1');S=null;V.ob={step:-1,name:'',days:[]};render()}},
 ob:d=>{const q=Q[V.ob.step],v=isNaN(d.v)?d.v:+d.v;if(q.multi){const a=V.ob[q.k]||[];V.ob[q.k]=a.includes(v)?a.filter(x=>x!=v):[...a,v]}else V.ob[q.k]=v;render()},
 uxr:async()=>{const f=V.sheet.f;if(!f.n.trim())return toast('Enter a name first');f.note='Researching…';render();Object.assign(f,await research(f.n,f.eq));render()},
 uxs:()=>{const f=V.sheet.f;if(!f.n.trim())return toast('Enter a name');const id='u_'+uid(),e={id,n:f.n.trim(),t:f.t,m:f.m,sec:f.sec||'',lo:+f.lo||6,hi:+f.hi||10,rest:+f.rest||90,inc:+f.inc||0,eq:f.eq,src:f.note||''};(S.ux=S.ux||[]).push(e);loadUx();const p=P(V.sheet.p);if(p)p.exs.push({id,sets:3,lo:e.lo,hi:e.hi,rest:e.rest});V.sheet=null;save();render()},

  if(o.notif&&window.Notification)try{await Notification.requestPermission()}catch{}render()}};

 if(c=='pname')P(t.dataset.p).name=v;else if(c=='px'){const p=P(t.dataset.p),x=p.exs[+t.dataset.i],k=t.dataset.k;x[k]=Math.max(1,+v||1);if(k=='rest')x.restSet=true}
 else if(c=='swap'){if(!v)return;const ex=P(t.dataset.p).exs[+t.dataset.i],x=X[v];Object.assign(ex,{id:v,lo:x[3],hi:x[4],rest:x[5],restSet:false})}else if(c=='addx'){if(!v)return;if(v=='__new'){V.sheet={t:'ux',p:t.dataset.p,f:{n:'',t:'c',m:'Chest',eq:'d',lo:6,hi:10,rest:150,inc:2}};return render()}const x=X[v];P(t.dataset.p).exs.push({id:v,sets:3,lo:x[3],hi:x[4],rest:x[5]})}

 else if(['auto','snd','vib','notif'].includes(c))S.set[c]=!!+v;else if(['ws'].includes(c)||c=='rest')S.set[c]=+v;else S.set[c]=v;
 save();render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(S&&S.draft)V.run=0;
